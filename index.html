<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pekom Melawi - PETA KOMPILASI p2 KANTAH MELAWI</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }

    .header-bar {
        position: fixed;
        top: 0; left: 0; right: 0;
        background: rgba(255, 255, 255, 0.95);
        display: flex;
        justify-content: center;
        padding: 4px 0; /* Sangat tipis */
        box-shadow: 0 1px 5px rgba(0,0,0,0.1);
        z-index: 1000;
    }

    .nav-container { 
        display: flex; 
        gap: 3px; 
        overflow-x: auto; 
        scrollbar-width: none; 
    }
    .nav-container::-webkit-scrollbar { display: none; }

    .btn-nav {
        text-decoration: none;
        color: #1a73e8;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 10px; /* Font lebih kecil */
        font-weight: 600;
        background: rgba(26, 115, 232, 0.05);
        white-space: nowrap;
    }

    .map-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    iframe { width: 100%; height: 100%; border: none; }

    .bottom-ui { position: fixed; bottom: 10px; right: 10px; z-index: 1000; }
    .credits { background: white; padding: 2px 8px; border-radius: 4px; font-size: 8px; opacity: 0.8; }
</style>
</head>
<body>

    <header class="header-bar">
        <nav class="nav-container">
            <a href="https://sites.google.com/view/pekommelawi/beranda?authuser=0" class="btn-nav">🏠 Beranda</a>
            <a href="https://sites.google.com/view/pekommelawi/gambar-lokasi" class="btn-nav">📄 Tutorial </a>
            <a href="https://sites.google.com/view/pekommelawi/cek-hgu-lbs?authuser=0" class="btn-nav">📑 HGU/LBS</a>
            <a href="https://sites.google.com/view/pekommelawi/bhumi?authuser=0" class="btn-nav">🌍 Bhumi</a>
        </nav>
    </header>

    <main class="map-container">
        <iframe 
            src="https://digitasi.polygon-oss.id/" 
            sandbox="allow-forms allow-scripts allow-same-origin allow-downloads allow-modals"
            allow="geolocation *; camera *; microphone *"
            title="Pekom Melawi">
        </iframe>
    </main>

    <div class="bottom-ui">
        <div class="credits">
            Powered by <a href="#" target="_blank">Studio Polygon</a>
            &copy; 2026 Kantah Melawi
        </div>
    </div>

</body>
</html>
